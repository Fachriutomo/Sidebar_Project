<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fachriutomo5</title>
    <link rel="stylesheet" href="loginpage.css">
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h2>Login to My Presonal</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Masukan Username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Masukan Password" required>
                </div>
                <button typ="submit" class="login-btn">Enter to Home</button>
            </form>
            <p id="error" class="error"></p>
        </div>
    </div>

    <script src="loginpage.js"></script>
</body>
</html>
